version: '3.8'

services:
  studio-agent:
    build: .
    container_name: studio_agent_node
    restart: unless-stopped
    environment:
      - PORT=8080
      - CLOUD_API_URL=${CLOUD_API_URL:-http://host.docker.internal:5000/api/v1}
      - STUDIO_OWNER_EMAIL=${STUDIO_OWNER_EMAIL}
      - STUDIO_OWNER_PASSWORD=${STUDIO_OWNER_PASSWORD}
      - TUNNEL_URL=${TUNNEL_URL}
      - DB_DIR=/usr/src/app/data
      - PREVIEW_DIR=/usr/src/app/data/cache
    volumes:
      - agent-data:/usr/src/app/data
      # Mount watched photo collections from local hard drive
      - ${LOCAL_PHOTOS_PATH:-c:/Users/adhav/Pictures}:/usr/src/app/watched_photos
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.24-alpine
    container_name: studio_agent_nginx
    restart: unless-stopped
    ports:
      - "${LOCAL_AGENT_PORT:-8082}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - studio-agent

  redis:
    image: redis:7-alpine
    container_name: studio_agent_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: studio_agent_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - nginx
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}

volumes:
  agent-data:
