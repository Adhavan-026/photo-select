worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Rate limiting zone for streaming requests
    limit_req_zone $binary_remote_addr zone=stream_limit:10m rate=30r/s;

    # Nginx Proxy Cache for streaming optimization (saves memory, speeds up file downloads)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=agent_cache:10m max_size=500m inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        # Enable gzip compression for responses
        gzip on;
        gzip_types image/webp text/plain application/json;

        # Cache image streams (thumbnails, previews, and watermarks)
        location /stream/ {
            limit_req zone=stream_limit burst=50 nodelay;

            proxy_cache agent_cache;
            proxy_cache_valid 200 206 60m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://studio-agent:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Stream specific buffering parameters
            proxy_buffering off;
            chunked_transfer_encoding on;
        }

        # Proxy general API/Dashboard requests to Node Agent (Un-cached)
        location / {
            proxy_pass http://studio-agent:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health endpoint
        location /nginx-health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
